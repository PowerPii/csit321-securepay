name: ci

# Built to spend few GitHub Actions minutes (the private repo's free 2,000 ran out on
# 18 Nov 2026). GitHub bills every job rounded UP to a whole minute, so:
#   - four jobs instead of eleven: each service's work runs as steps of one job;
#   - a job only runs for the parts of the repo a change touches (the `changes` job decides;
#     a docs-only change runs `changes` and `ci-ok` only);
#   - one run per change: pushes to feature branches do not run CI, pull requests do, and so
#     do main, staging and dev after a merge (the deploy workflow waits for main's run;
#     BRANCHING.md has the branch model);
#   - a newer push to a pull request cancels the run still going for the older one;
#   - pip and npm downloads are cached.
# `ci-ok` is the one check for branch protection to require. It is green only when every job
# that had to run passed. "Run workflow" (Actions tab) runs everything, for a full test report.
on:
  push:
    branches: [main, staging, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Never cancel a run on main: the deploy workflow needs its result.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Works out what the change touches, then runs the quick repo-wide checks: merge freeze,
  # gitleaks, the contracts, the test-report mapping and (when deploy files change) the
  # public server's config.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.paths.outputs.python }}
      frontend: ${{ steps.paths.outputs.frontend }}
    env:
      MAIL_PASSWORD_HASH: $2a$14$abcdefghijklmnopqrstuuMOs2yZ1nOv8wOEUx1AYQ1zt6S1zBe2m
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: paths
        name: Decide what to test
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: bash .github/ci-changes.sh
      # Only pull requests into main: dev and staging do not touch the live server's code.
      - name: Merge freeze (deploy/RUNBOOK.md section 10a)
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' }}
        env:
          UNTIL: ${{ vars.MERGE_FREEZE_UNTIL }}
        run: |
          if [ -z "$UNTIL" ]; then echo "No merge freeze."; exit 0; fi
          end="$(date -d "$UNTIL" +%s)" || { echo "::error::MERGE_FREEZE_UNTIL is not a date: $UNTIL"; exit 1; }
          if [ "$end" -gt "$(date +%s)" ]; then
            echo "::error::Merge freeze for a demo until $UNTIL. Do not merge; wait, or ask Fifa to clear MERGE_FREEZE_UNTIL."
            exit 1
          fi
          echo "The freeze ended at $UNTIL."
      - name: Secrets scan (gitleaks)
        if: ${{ !cancelled() }}
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v7
        if: ${{ !cancelled() }}
        with:
          python-version: "3.12"
      - if: ${{ !cancelled() }}
        run: pip install -q jsonschema pyyaml openapi-spec-validator
      - name: Contracts
        if: ${{ !cancelled() }}
        run: python contracts/check.py
      # The test report's mapping (docs/test-report/evidence.yaml) still names real tests.
      - name: Test report mapping
        if: ${{ !cancelled() }}
        run: python tests/report/build_report.py --check
      # The public server's Compose file and Caddyfile parse with the example settings, and
      # the production Caddy image (checkout + dashboard bundles) builds.
      - name: Deploy config
        if: ${{ !cancelled() && steps.paths.outputs.deploy == 'true' }}
        run: |
          docker compose --env-file deploy/prod.env.example -f deploy/compose.prod.yaml config -q
          # Staging (deploy/STAGING.md): the override applies, and the staging Caddyfile made
          # from the production one is valid.
          docker compose --env-file deploy/staging.env.example -f deploy/compose.prod.yaml -f deploy/compose.staging.yaml config -q
          sh deploy/caddy/staging-caddyfile.sh deploy/Caddyfile.prod > "$RUNNER_TEMP/Caddyfile.staging"
          docker run --rm -e DOMAIN=staging.example.com -e ACME_EMAIL=ci@example.com \
            -e MAIL_USER=team -e MAIL_PASSWORD_HASH \
            -v "$RUNNER_TEMP/Caddyfile.staging:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.9@sha256:4851e54a46b206517c574821bb5cc67f170d2156041e9fbc4c9193b45e84a75b caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          # Production's Caddy with the staging forward switched on.
          mkdir -p "$RUNNER_TEMP/extra" && cp deploy/caddy/staging.caddy.tmpl "$RUNNER_TEMP/extra/staging.caddy"
          docker run --rm -e DOMAIN=203-0-113-5.sslip.io -e STAGING_DOMAIN=staging.example.com -e ACME_EMAIL=ci@example.com \
            -e MAIL_USER=team -e MAIL_PASSWORD_HASH \
            -v "$PWD/deploy/Caddyfile.prod:/etc/caddy/Caddyfile:ro" -v "$RUNNER_TEMP/extra:/etc/caddy/extra:ro" \
            caddy:2.11.9@sha256:4851e54a46b206517c574821bb5cc67f170d2156041e9fbc4c9193b45e84a75b caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker run --rm -e DOMAIN=203-0-113-5.sslip.io -e ACME_EMAIL=ci@example.com \
            -e MAIL_USER=team -e MAIL_PASSWORD_HASH \
            -v "$PWD/deploy/Caddyfile.prod:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.9@sha256:4851e54a46b206517c574821bb5cc67f170d2156041e9fbc4c9193b45e84a75b caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker build -f deploy/caddy/Dockerfile -t securepay-caddy .
          # bash -n checks only its first file, so check each script on its own.
          for f in deploy/*.sh deploy/backup/*.sh deploy/tests/*.sh deploy/postgres/init/*.sh; do bash -n "$f" || exit 1; done
          # The database image (initialiser baked in at a fixed mode) builds.
          docker build -q -t securepay-db:ci deploy/postgres >/dev/null
          # backup.sh is all-or-nothing, here and on the macOS system Bash 3.2.
          bash deploy/tests/backup-test.sh
          docker run --rm -v "$PWD:/repo:ro" bash:3.2@sha256:2556c2da19c32c1614d318645c73a7bf64d38be21cf69e98e3ca51f053983719 bash /repo/deploy/tests/backup-test.sh

  # Gateway, simulator and merchant, one after another in one job (each in its own virtual
  # environment, as before; steps in .github/ci-python.sh). One failing service does not stop
  # the others.
  python:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.python != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.12-trixie@sha256:0d938e975177bef9f1f61f3f9dbcf2e0aa0a139568f66d3415ed8892eb97f6ac
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      SERVICES: ${{ needs.changes.outputs.python }}
      DJANGO_DEBUG: "1"
      POSTGRES_HOST: localhost
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      DB_PASSWORD: postgres
      VAULT_DB_USER: postgres
      VAULT_DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "*/requirements-dev.lock"
      - name: Test ${{ needs.changes.outputs.python }}
        run: |
          failed=""
          for svc in $SERVICES; do
            echo "::group::$svc"
            bash .github/ci-python.sh "$svc" || failed="$failed $svc"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "::error::Failed:$failed"; exit 1; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: junit-python
          path: "*/junit-*.xml"
          if-no-files-found: ignore
          retention-days: 7

  # Checkout, dashboard, website and the Node.js SDK (sdk/node), one after another in one job
  # (steps in .github/ci-frontend.sh).
  frontend:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.frontend != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APPS: ${{ needs.changes.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/*/package-lock.json
            sdk/node/package-lock.json
      - name: Test ${{ needs.changes.outputs.frontend }}
        run: |
          failed=""
          for app in $APPS; do
            echo "::group::$app"
            bash .github/ci-frontend.sh "$app" || failed="$failed $app"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "::error::Failed:$failed"; exit 1; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: junit-frontend
          path: frontend/*/junit-*.xml
          if-no-files-found: ignore
          retention-days: 7

  # The one check for branch protection to require. Red if any job that ran failed (a job
  # skipped because the change did not touch its part is fine). Also builds the
  # non-functional test report (URS Section 4.4) from the JUnit results; parts that did not
  # run show as "Not run" (Actions, ci, "Run workflow" gives a full report).
  ci-ok:
    if: always()
    needs: [changes, python, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -q pyyaml
      - uses: actions/download-artifact@v8
        with:
          pattern: junit-*
          path: reports
          merge-multiple: true
      - name: Test report
        run: |
          mkdir -p reports
          python tests/report/build_report.py --junit reports --out TEST-REPORT.md --strict
      - if: always()
        run: test -f TEST-REPORT.md && cat TEST-REPORT.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-report
          path: TEST-REPORT.md
          if-no-files-found: ignore
      - name: All required jobs passed
        if: always()
        env:
          RESULTS: ${{ needs.changes.result }} ${{ needs.python.result }} ${{ needs.frontend.result }}
        run: |
          echo "changes, python, frontend: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "::error::A CI job did not pass ($RESULTS)."; exit 1 ;; esac
          done

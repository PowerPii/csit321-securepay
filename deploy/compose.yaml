# Local / demo stack. One VM, one container per part, Caddy in front of everything.
#   docker compose -f deploy/compose.yaml up --build
# Before the first run: copy each secrets/*.example to the same name without .example.

x-django: &django
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
  environment: &django-env
    DJANGO_DEBUG: "1"
    REDTEAM_ENABLED: "true"  # v2 red team (docs/v2/RED-TEAM.md); never in production
    POSTGRES_HOST: db
    SECRETS_DIR: /run/secrets

services:
  db:
    # postgres/Dockerfile: the pinned PostgreSQL image with postgres/init baked in at a fixed
    # mode, so a fresh volume starts the same way on Linux and Docker Desktop.
    build: ./postgres
    image: securepay-db:local
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password, gateway_db_password, vault_db_password, simulator_db_password, merchant_db_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      # Healthy only once postgres/init/01-databases.sh has made all 4 roles, all 3 databases
      # and the vault schema: a first start that stopped half-way must not look ready.
      test: ["CMD-SHELL", "pg_isready -U postgres && psql -U postgres -d gateway -tAc \"SELECT (SELECT count(*) FROM pg_roles WHERE rolname IN ('gateway','vault','simulator','merchant')) + (SELECT count(*) FROM pg_database WHERE datname IN ('gateway','simulator','merchant')) + (SELECT count(*) FROM pg_namespace WHERE nspname = 'vault')\" | grep -qx 8"]
      interval: 5s
      retries: 10

  gateway:
    <<: *django
    build:
      context: ../gateway
      labels:
        org.opencontainers.image.revision: "${GIT_REVISION:-unknown}"
    environment:
      <<: *django-env
      POSTGRES_DB: gateway
      POSTGRES_USER: gateway
      DJANGO_ALLOWED_HOSTS: gateway.localhost,gateway
      CHECKOUT_BASE_URL: https://gateway.localhost/pay
      GUEST_STATUS_URL: https://gateway.localhost/guest/status  # receipts link here (FR-CHK-15)
      DASHBOARD_URL: https://gateway.localhost/dashboard  # reset, verification and notice links
      SIMULATOR_URL: https://simulator.localhost
      SIMULATOR_CA_BUNDLE: &caddy-root /caddy-ca/root.crt
      # Screening: client IP from Caddy's X-Forwarded-For; verification codes to Mailpit
      # (https://mail.localhost). The fraud model: copy its folder into
      # gateway/apps/risk/model_artifacts/ and put RISK_MODEL_VERSION=<folder name> in
      # deploy/.env (gateway/apps/risk/model_artifacts/README.md). Unset = stub model, rules
      # decide. Set but missing or failing its checks = every payment blocked as
      # screening_unavailable, so a broken install shows at once.
      TRUSTED_PROXY_HOPS: "1"
      EMAIL_HOST: mailpit
      EMAIL_PORT: "1025"
      RISK_MODEL_VERSION: ${RISK_MODEL_VERSION:-}
      RISK_MODEL_SHA256: ${RISK_MODEL_SHA256:-}
    # Apply migrations (the vault's on its own role and schema), seed the demo block and
    # review lists, then serve.
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py migrate --database=vault --noinput && python manage.py seed_risk_lists && exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 30"]
    volumes:
      - caddy_ca:/caddy-ca:ro  # Caddy's local root certificate (public part only), to verify https://simulator.localhost
      - ../gateway/apps/risk/model_artifacts:/app/apps/risk/model_artifacts:ro  # trained models (git-ignored)
    secrets:
      - source: gateway_django_secret_key
        target: django_secret_key
      - source: gateway_db_password
        target: db_password
      - vault_db_password
      - vault_encryption_key
      - card_fingerprint_key
      - field_encryption_key
      - simulator_api_key
      - simulator_signing_secret
    networks: [data, gateway, edge]

  # Delivers webhooks from the outbox, runs the 7-day auto-cancel (a simulator cancel) and
  # ends checkout sessions past their hour (which discards any card left in the vault, and
  # blocks payments still waiting for a verification code).
  gateway-worker:
    <<: *django
    build:
      context: ../gateway
      labels:
        org.opencontainers.image.revision: "${GIT_REVISION:-unknown}"
    command: ["python", "manage.py", "run_worker"]
    environment:
      <<: *django-env
      POSTGRES_DB: gateway
      POSTGRES_USER: gateway
      SIMULATOR_URL: https://simulator.localhost
      SIMULATOR_CA_BUNDLE: *caddy-root
      WEBHOOK_CA_BUNDLE: *caddy-root
      # The demo shop sits on a private Docker network behind Caddy. Never set in production.
      WEBHOOK_ALLOWED_PRIVATE_HOSTS: shop.localhost
      # Receipts and guest status codes leave from the email outbox here (Mailpit locally).
      EMAIL_HOST: mailpit
      EMAIL_PORT: "1025"
      GUEST_STATUS_URL: https://gateway.localhost/guest/status
      DASHBOARD_URL: https://gateway.localhost/dashboard  # reset, verification and notice links
    volumes:
      - caddy_ca:/caddy-ca:ro
    secrets:
      - source: gateway_django_secret_key
        target: django_secret_key
      - source: gateway_db_password
        target: db_password
      - field_encryption_key  # decrypts merchant signing secrets to sign webhooks
      - vault_db_password
      - vault_encryption_key
      - card_fingerprint_key
      - simulator_api_key
      - simulator_signing_secret
    networks: [data, gateway, edge]

  simulator:
    <<: *django
    build:
      context: ../simulator
      labels:
        org.opencontainers.image.revision: "${GIT_REVISION:-unknown}"
    environment:
      <<: *django-env
      POSTGRES_DB: simulator
      POSTGRES_USER: simulator
      DJANGO_ALLOWED_HOSTS: simulator.localhost,simulator
      # Test controls (/sim/faults, SIMULATOR-CONTRACT.md section 8) for tests/integration.
      # Set to "0" for a demo where nobody should be able to inject faults.
      SIM_TEST_CONTROLS: ${SIM_TEST_CONTROLS:-1}
      # `notify` fault rules post signed notifications to the gateway through Caddy.
      SIM_GATEWAY_NOTIFY_URL: https://gateway.localhost/internal/simulator/notifications
      SIM_GATEWAY_CA_BUNDLE: *caddy-root
      # v2: authorisations go to the issuer through the switch (network-switch below).
      SIM_ROLE: acquirer
      SIM_SWITCH_URL: http://network-switch:8001/net/switch
    command: ["sh", "-c", "python manage.py migrate --noinput && exec gunicorn config.wsgi:application --bind 0.0.0.0:8001 --workers 4 --timeout 30"]
    volumes:
      - caddy_ca:/caddy-ca:ro
    secrets:
      - source: simulator_django_secret_key
        target: django_secret_key
      - source: simulator_db_password
        target: db_password
      - simulator_api_key
      - simulator_signing_secret
      - simulator_test_control_key
    networks: [data, simulator]

  # v2 network split (contracts/NETWORK-CONTRACT.md): the same simulator image in two more
  # roles. The simulator above is the acquirer; it sends each authorisation to the switch,
  # which routes it to the issuer. Private simulator network only, signed messages, no
  # database (they keep no state).
  network-switch:
    restart: unless-stopped
    build:
      context: ../simulator
      labels:
        org.opencontainers.image.revision: "${GIT_REVISION:-unknown}"
    environment:
      <<: *django-env
      SIM_ROLE: switch
      SIM_ISSUER_URL: http://network-issuer:8001/net/issuer
      DJANGO_ALLOWED_HOSTS: network-switch
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8001", "--workers", "2", "--timeout", "30"]
    secrets:
      - source: simulator_django_secret_key
        target: django_secret_key
      - simulator_signing_secret
    networks: [simulator]

  network-issuer:
    restart: unless-stopped
    build:
      context: ../simulator
      labels:
        org.opencontainers.image.revision: "${GIT_REVISION:-unknown}"
    environment:
      <<: *django-env
      SIM_ROLE: issuer
      DJANGO_ALLOWED_HOSTS: network-issuer
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8001", "--workers", "2", "--timeout", "30"]
    secrets:
      - source: simulator_django_secret_key
        target: django_secret_key
      - simulator_signing_secret
    networks: [simulator]

  merchant:
    <<: *django
    build:
      context: ../merchant
      labels:
        org.opencontainers.image.revision: "${GIT_REVISION:-unknown}"
    environment:
      <<: *django-env
      POSTGRES_DB: merchant
      POSTGRES_USER: merchant
      DJANGO_ALLOWED_HOSTS: shop.localhost,merchant
      SECUREPAY_API_URL: https://gateway.localhost
      SECUREPAY_CA_BUNDLE: *caddy-root
      SHOP_BASE_URL: https://shop.localhost
    command: ["sh", "-c", "python manage.py migrate --noinput && exec gunicorn config.wsgi:application --bind 0.0.0.0:8002 --workers 3 --timeout 30"]
    volumes:
      - caddy_ca:/caddy-ca:ro
    # The shop's SecurePay API key and signing secret, from `create_merchant` (README).
    secrets:
      - source: merchant_django_secret_key
        target: django_secret_key
      - source: merchant_db_password
        target: db_password
      - securepay_api_key
      - securepay_signing_secret
    networks: [data, merchant, edge]

  caddy:
    image: caddy:2.11.9@sha256:4851e54a46b206517c574821bb5cc67f170d2156041e9fbc4c9193b45e84a75b
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../frontend/checkout/dist:/srv/checkout:ro
      - ../frontend/dashboard/dist:/srv/dashboard:ro
      - caddy_data:/data
      - caddy_ca:/ca
    # Caddy keeps its local CA under /data with owner-only permissions, so the app
    # containers (not root) cannot read it there. Once Caddy has made the root
    # certificate, copy only that public file, world-readable, into caddy_ca.
    # The CA's private key never leaves caddy_data.
    command:
      - sh
      - -c
      - |
        caddy run --config /etc/caddy/Caddyfile --adapter caddyfile &
        pid=$$!
        trap 'kill -TERM $$pid' TERM INT
        root=/data/caddy/pki/authorities/local/root.crt
        until [ -s "$$root" ]; do sleep 1; done
        install -m 0644 "$$root" /ca/root.crt
        wait $$pid
        wait $$pid
    # Services call each other by public name through Caddy, so every hop is HTTPS.
    networks:
      edge:
        aliases: [gateway.localhost, shop.localhost]
      gateway:
        aliases: [simulator.localhost, shop.localhost, gateway.localhost]
      simulator:
        aliases: [gateway.localhost]  # simulator notifications (section 9)
      merchant:
        aliases: [gateway.localhost]

  mailpit:
    image: axllent/mailpit:v1.34.0@sha256:23a2ef85bc50853ab3093645d1d64679afd8887e89da5e48a88940c172591a4e
    restart: unless-stopped
    networks: [gateway, edge]

networks:
  edge: {}
  data: { internal: true }
  gateway: { internal: true }
  simulator: { internal: true }
  merchant: { internal: true }

volumes:
  pgdata: {}
  caddy_data: {}
  caddy_ca: {}

secrets:
  postgres_password: { file: ./secrets/postgres_password }
  gateway_django_secret_key: { file: ./secrets/gateway_django_secret_key }
  gateway_db_password: { file: ./secrets/gateway_db_password }
  vault_db_password: { file: ./secrets/vault_db_password }
  vault_encryption_key: { file: ./secrets/vault_encryption_key }
  card_fingerprint_key: { file: ./secrets/card_fingerprint_key }
  field_encryption_key: { file: ./secrets/field_encryption_key }
  simulator_django_secret_key: { file: ./secrets/simulator_django_secret_key }
  simulator_db_password: { file: ./secrets/simulator_db_password }
  merchant_django_secret_key: { file: ./secrets/merchant_django_secret_key }
  merchant_db_password: { file: ./secrets/merchant_db_password }
  simulator_api_key: { file: ./secrets/simulator_api_key }
  simulator_signing_secret: { file: ./secrets/simulator_signing_secret }
  simulator_test_control_key: { file: ./secrets/simulator_test_control_key }
  securepay_api_key: { file: ./secrets/securepay_api_key }
  securepay_signing_secret: { file: ./secrets/securepay_signing_secret }

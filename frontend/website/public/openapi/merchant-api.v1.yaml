webhooks:
  paymentOrRefundEvent:
    post:
      summary: Status change notification sent to the merchant's approved HTTPS address
      description: 'Sent by the gateway worker from the outbox. Verify `SecurePay-Signature` over the
        raw

        body, reject timestamps older than 5 minutes, deduplicate on the event `id`, ignore an

        event whose `sequence` is not higher than the stored one, then reply 2xx within 10

        seconds. Anything else is retried until the retry window ends ([the guides](https://www.securepaysg.me/developers#webhooks)).

        Redirects are not followed.

        '
      security: []
      parameters:
      - name: SecurePay-Signature
        in: header
        required: true
        schema:
          type: string
          pattern: ^t=[0-9]+,v1=[0-9a-f]{64}$
      - name: SecurePay-Event-Id
        in: header
        required: true
        schema:
          type: string
      - name: SecurePay-Event-Type
        in: header
        required: true
        schema:
          type: string
      - name: SecurePay-Delivery-Attempt
        in: header
        required: true
        description: 1 for the first attempt, then 2, 3, ...
        schema:
          type: integer
          minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
      responses:
        2XX:
          description: Accepted. Any 2xx status counts; the body is ignored.
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: '`Authorization: Bearer sp_test_<40 base62 chars>` (test mode) or `sp_live_...` (live

        mode, v2). Shown once at creation, stored as a digest. One active key per

        merchant and mode. A key only sees objects of its own mode; the other mode''s answer 404.

        '
  parameters:
    PaymentId:
      name: payment_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^pay_[0-9A-Za-z]{24}$
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 'Required on every POST. 8 to 255 printable ASCII characters, unique per logical

        operation; a UUID v4 is recommended. Scoped to the merchant, kept 24 hours from first

        use. See [the guides](https://www.securepaysg.me/developers#idempotency).

        '
      schema:
        type: string
        minLength: 8
        maxLength: 255
        pattern: ^[\x21-\x7E]+$
  headers:
    Signature:
      description: '`t=<unix seconds>,v1=<hex HMAC-SHA256 of "t." + raw body>` with the merchant signing
        secret.'
      schema:
        type: string
        pattern: ^t=[0-9]+,v1=[0-9a-f]{64}$
    RequestId:
      description: Correlation ID for support and the audit log.
      schema:
        type: string
        pattern: ^req_[0-9A-Za-z]{24}$
    IdempotentReplayed:
      description: '`true` when this is the stored response of an earlier request with the same key.'
      schema:
        type: string
        enum:
        - 'true'
    RetryAfter:
      description: Seconds to wait before trying again.
      schema:
        type: integer
        minimum: 1
  schemas:
    Currency:
      enum:
      - SGD
      - USD
      - EUR
      - MYR
      - THB
      - IDR
      - PHP
      - JPY
      description: v2 multi-currency (docs/v2/FX.md). The merchant is always paid in SGD.
    Settlement:
      type: object
      additionalProperties: false
      required:
      - currency
      - amount
      - captured_amount
      - fx
      description: 'v2: what the payment is worth to the merchant, in SGD cents, at the rate locked when
        it was created. Fees, the reserve, the balance and payouts all use these amounts.'
      properties:
        currency:
          const: SGD
        amount:
          $ref: '#/components/schemas/AmountCents'
        captured_amount:
          type: integer
          minimum: 0
          maximum: 1000000
        fx:
          description: null for an SGD payment.
          oneOf:
          - type: 'null'
          - type: object
            additionalProperties: false
            required:
            - rate
            - rate_sheet
            - fee_percent
            properties:
              rate:
                type: string
                pattern: ^[0-9]+(\.[0-9]+)?$
                description: SGD per one unit of the payment's currency, locked at creation.
              rate_sheet:
                type: string
                pattern: ^fxr_[0-9A-Za-z]{24}$
                description: The published rate sheet it came from (GET /v1/fx_rates).
              fee_percent:
                type: string
                pattern: ^[0-9]+(\.[0-9]+)?$
                description: FX fee on the SGD amount, taken at capture (1).
    AmountCents:
      type: integer
      minimum: 50
      maximum: 1000000
      description: 'Singapore dollars in cents: S$0.50 to S$10,000.'
    PaymentStatus:
      description: Where the payment is in its lifecycle. See the guides for the diagram.
      enum:
      - created
      - screening
      - verification_required
      - processing
      - authorised
      - captured
      - declined
      - blocked
      - unresolved
      - cancelled
      - expired
    OutcomeReason:
      enum:
      - fraud_rule
      - fraud_model
      - verification_failed
      - verification_expired
      - screening_unavailable
      - amount_limit
      - card_declined
      - not_processed
      - checkout_expired
      - merchant_cancelled
      - authorisation_expired
      description: 'The first six are fraud or limit blocks. card_declined: the simulated bank said no.
        not_processed: reconciliation found no record at the simulator. checkout_expired: no card submitted
        within 1 hour. merchant_cancelled / authorisation_expired: the two ways an authorisation is cancelled.'
    LineItem:
      type: object
      additionalProperties: false
      required:
      - name
      - quantity
      - unit_amount
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: What the customer is buying, as shown on the checkout page.
        quantity:
          type: integer
          minimum: 1
          maximum: 999
        unit_amount:
          type: integer
          minimum: 0
          description: One unit, in the payment's currency (smallest unit).
    Payment:
      title: Payment
      description: A card payment as the merchant sees it. Returned by the merchant API and carried in
        payment.* webhook events. Never contains a card number or security code.
      type: object
      additionalProperties: false
      required:
      - id
      - object
      - livemode
      - reference
      - order_reference
      - status
      - amount
      - currency
      - settlement
      - captured_amount
      - refundable_amount
      - refunded_amount
      - refund_reserved_amount
      - card
      - screening
      - outcome
      - pending_operation
      - sequence
      - checkout_expires_at
      - authorisation_expires_at
      - created_at
      - updated_at
      properties:
        id:
          type: string
          pattern: ^pay_[0-9A-Za-z]{24}$
          description: Gateway identifier used in API paths.
        object:
          const: payment
        livemode:
          type: boolean
          description: true for a live-mode key (sp_live_...), false for test mode (sp_test_...). The
            two modes never mix (v2).
        reference:
          type: string
          pattern: ^SP-[0-9A-Z]{4}-[0-9A-Z]{4}$
          description: Unique payment reference shown to the customer on receipts and used for the guest
            status check.
        order_reference:
          type: string
          minLength: 1
          maxLength: 64
          description: The merchant's own order reference, as sent when the payment was created.
        status:
          $ref: '#/components/schemas/PaymentStatus'
        amount:
          type: integer
          minimum: 1
          description: 'In the payment''s currency, as an integer of its smallest unit: cents for SGD,
            USD, EUR, MYR, THB and PHP; whole yen and rupiah for JPY and IDR. Its SGD value (settlement.amount)
            must be S$0.50 to S$10,000.'
        currency:
          $ref: '#/components/schemas/Currency'
        settlement:
          $ref: '#/components/schemas/Settlement'
        line_items:
          description: What the order contains, as the merchant sent it when creating the payment (shown
            on the hosted checkout page). quantity x unit_amount summed over all items equals amount.
            null if the merchant sent none.
          oneOf:
          - type: 'null'
          - type: array
            minItems: 1
            maxItems: 50
            items:
              $ref: '#/components/schemas/LineItem'
        captured_amount:
          type: integer
          minimum: 0
          description: Amount actually charged. Equals amount after a full capture, less after a partial
            capture (the rest of the authorisation is released). 0 until captured.
        refundable_amount:
          type: integer
          minimum: 0
          description: captured_amount less completed and reserved refunds. 0 unless status is captured.
        refunded_amount:
          type: integer
          minimum: 0
          description: Sum of completed refunds.
        refund_reserved_amount:
          type: integer
          minimum: 0
          description: Sum of refunds that are reserved, submitted or unresolved.
        card:
          description: Present once the customer has entered a card; null before that.
          oneOf:
          - type: 'null'
          - type: object
            additionalProperties: false
            required:
            - token
            - brand
            - last4
            properties:
              token:
                type: string
                pattern: ^tok_[0-9A-Za-z]{24}$
              brand:
                enum:
                - visa
                - mastercard
                - amex
                - unknown
              last4:
                type: string
                pattern: ^[0-9]{4}$
        screening:
          description: Fraud screening decision. null until screening has run. Scores and rule details
            stay in the dashboard.
          oneOf:
          - type: 'null'
          - type: object
            additionalProperties: false
            required:
            - decision
            properties:
              decision:
                enum:
                - allow
                - verify
                - block
                - not_screened
                description: not_screened means screening was unavailable and the attempt was blocked.
        outcome:
          description: Why the payment did not go ahead, and what the merchant can do next. null while
            the payment is in progress or succeeded.
          oneOf:
          - type: 'null'
          - type: object
            additionalProperties: false
            required:
            - reason
            - message
            properties:
              reason:
                $ref: '#/components/schemas/OutcomeReason'
              message:
                type: string
                description: Plain-language explanation with the next step. Safe to show to staff, not
                  tuned for customers.
        pending_operation:
          description: A capture or cancel that was sent to the processing simulator without an answer
            yet. The payment keeps its previous status until reconciliation settles it. null otherwise.
          oneOf:
          - type: 'null'
          - type: object
            additionalProperties: false
            required:
            - type
            - status
            - requested_at
            properties:
              type:
                enum:
                - capture
                - cancel
              status:
                const: unresolved
              requested_at:
                type: string
                format: date-time
        sequence:
          type: integer
          minimum: 1
          description: Increases by 1 on every change the merchant is notified about, including refund
            changes. Matches the sequence of the latest event for this payment, so the merchant can ignore
            older events.
        return_url:
          type: string
          format: uri
        checkout_url:
          type:
          - string
          - 'null'
          format: uri
          description: Hosted checkout address. Only while status is created and the session has not expired;
            null afterwards.
        checkout_expires_at:
          type: string
          format: date-time
          description: created_at + 1 hour.
        authorisation_expires_at:
          type:
          - string
          - 'null'
          format: date-time
          description: 'When an uncaptured authorisation is cancelled automatically: authorised_at + 7
            days. null unless status is authorised.'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        authorised_at:
          type:
          - string
          - 'null'
          format: date-time
        captured_at:
          type:
          - string
          - 'null'
          format: date-time
        cancelled_at:
          type:
          - string
          - 'null'
          format: date-time
    Refund:
      title: Refund
      description: A full or partial refund of a captured payment, with its own reference.
      type: object
      additionalProperties: false
      required:
      - id
      - object
      - livemode
      - reference
      - payment_id
      - payment_reference
      - amount
      - currency
      - settlement
      - status
      - failure_reason
      - created_at
      - updated_at
      properties:
        id:
          type: string
          pattern: ^rfd_[0-9A-Za-z]{24}$
        object:
          const: refund
        livemode:
          type: boolean
          description: true for a live-mode key (sp_live_...), false for test mode (sp_test_...). The
            two modes never mix (v2).
        reference:
          type: string
          pattern: ^RF-[0-9A-Z]{4}-[0-9A-Z]{4}$
        payment_id:
          type: string
          pattern: ^pay_[0-9A-Za-z]{24}$
        payment_reference:
          type: string
          pattern: ^SP-[0-9A-Z]{4}-[0-9A-Z]{4}$
        amount:
          type: integer
          minimum: 1
          description: In the payment's currency (smallest unit).
        currency:
          enum:
          - SGD
          - USD
          - EUR
          - MYR
          - THB
          - IDR
          - PHP
          - JPY
          description: The payment's currency (v2).
        settlement:
          type: object
          additionalProperties: false
          required:
          - currency
          - amount
          description: 'v2: what the refund takes from the merchant''s balance, in SGD cents, at the payment''s
            locked rate.'
          properties:
            currency:
              const: SGD
            amount:
              type: integer
              minimum: 0
              maximum: 1000000
        status:
          enum:
          - reserved
          - submitted
          - completed
          - failed
          - unresolved
          description: 'reserved: amount held, not yet sent. submitted: sent to the simulator. unresolved:
            no answer; the amount stays reserved until reconciliation. completed and failed are final.
            A refund request the gateway refuses is answered with an error and creates no refund object.'
        reason:
          type:
          - string
          - 'null'
          maxLength: 200
          description: Free text from the merchant. Must not contain card data.
        failure_reason:
          description: Set only when status is failed.
          oneOf:
          - type: 'null'
          - enum:
            - declined_by_processor
            - not_processed
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed_at:
          type:
          - string
          - 'null'
          format: date-time
    Balance:
      title: Balance
      description: A merchant's balance from the double-entry ledger (v2). Amounts are integer cents.
        `available` can be paid out; `reserve` is held back from each capture and released after the hold.
      type: object
      additionalProperties: false
      required:
      - object
      - livemode
      - currency
      - available
      - reserve
      - next_release
      properties:
        object:
          const: balance
        livemode:
          type: boolean
          description: true for a live-mode key (sp_live_...), false for test mode (sp_test_...). The
            two modes never mix (v2).
        currency:
          const: SGD
        available:
          type: integer
          description: Can be paid out now. Negative only if refunds took more than was available.
        reserve:
          type: integer
          minimum: 0
          description: Held back from captures; moves to available after the hold.
        next_release:
          oneOf:
          - type: 'null'
          - type: object
            additionalProperties: false
            required:
            - amount
            - at
            - payment_id
            properties:
              amount:
                type: integer
                minimum: 1
              at:
                type: string
                format: date-time
              payment_id:
                type:
                - string
                - 'null'
                pattern: ^pay_[0-9A-Za-z]{24}$
          description: 'The oldest reserve still held: how much and when it is released. Null if nothing
            is held.'
    Payout:
      title: Payout
      description: Money sent from the merchant's available balance to its bank account (v2 ledger). The
        transfer is simulated, so a payout is `paid` at once.
      type: object
      additionalProperties: false
      required:
      - id
      - object
      - livemode
      - amount
      - currency
      - status
      - merchant_id
      - created_at
      properties:
        id:
          type: string
          pattern: ^po_[0-9A-Za-z]{24}$
        object:
          const: payout
        livemode:
          type: boolean
          description: true for a live-mode key (sp_live_...), false for test mode (sp_test_...). The
            two modes never mix (v2).
        amount:
          type: integer
          minimum: 1
        currency:
          const: SGD
        status:
          enum:
          - paid
        merchant_id:
          type: string
          pattern: ^mer_[0-9A-Za-z]{24}$
        created_at:
          type: string
          format: date-time
    FxRates:
      title: FxRates
      description: 'v2: the published FX rate sheet (docs/v2/FX.md). SGD per one unit of each other currency.'
      type: object
      additionalProperties: false
      required:
      - object
      - id
      - base
      - published_at
      - fee_percent
      - rates
      properties:
        object:
          const: fx_rates
        id:
          type: string
          pattern: ^fxr_[0-9A-Za-z]{24}$
        base:
          const: SGD
        published_at:
          type: string
          format: date-time
        fee_percent:
          type: string
          pattern: ^[0-9]+(\.[0-9]+)?$
          description: FX fee on the SGD amount of a payment in another currency.
        rates:
          type: object
          additionalProperties: false
          required:
          - USD
          - EUR
          - MYR
          - THB
          - IDR
          - PHP
          - JPY
          patternProperties:
            ^[A-Z]{3}$:
              type: string
              pattern: ^[0-9]+(\.[0-9]+)?$
          properties:
            USD:
              type: string
            EUR:
              type: string
            MYR:
              type: string
            THB:
              type: string
            IDR:
              type: string
            PHP:
              type: string
            JPY:
              type: string
    Event:
      title: Event
      description: Envelope of every webhook the gateway sends. The per-type schemas in contracts/events/
        narrow type and data.
      type: object
      additionalProperties: false
      required:
      - id
      - object
      - livemode
      - type
      - created_at
      - payment_id
      - sequence
      - data
      properties:
        id:
          type: string
          pattern: ^evt_[0-9A-Za-z]{24}$
          description: Unique per event, the same on every delivery attempt. The merchant deduplicates
            on it.
        object:
          const: event
        livemode:
          type: boolean
          description: true for a live-mode key (sp_live_...), false for test mode (sp_test_...). The
            two modes never mix (v2).
        type:
          enum:
          - payment.processing
          - payment.verification_required
          - payment.authorised
          - payment.declined
          - payment.blocked
          - payment.unresolved
          - payment.captured
          - payment.cancelled
          - payment.expired
          - refund.completed
          - refund.failed
          - refund.unresolved
        created_at:
          type: string
          format: date-time
          description: When the status change was committed. Not the signature timestamp, which is fresh
            on every attempt.
        payment_id:
          type: string
          pattern: ^pay_[0-9A-Za-z]{24}$
          description: The payment this event belongs to, also for refund events.
        sequence:
          type: integer
          minimum: 1
          description: Per-payment order shared by payment and refund events. Ignore an event whose sequence
            is not higher than the one you stored.
        data:
          type: object
          additionalProperties: false
          required:
          - object
          properties:
            object:
              description: Snapshot of the payment or refund at the moment of the change.
              oneOf:
              - $ref: '#/components/schemas/Payment'
              - $ref: '#/components/schemas/Refund'
    Error:
      title: Error
      description: Body of every 4xx and 5xx response from the merchant API and the guest status API.
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
          - type
          - code
          - message
          - request_id
          properties:
            type:
              enum:
              - invalid_request
              - authentication
              - permission
              - not_found
              - conflict
              - business_rule
              - rate_limit
              - server
              description: Broad class; one per HTTP status family (see [the guides](https://www.securepaysg.me/developers#errors)).
            code:
              type: string
              pattern: ^[a-z][a-z0-9_]*$
              description: Stable machine-readable code from the table in [the guides](https://www.securepaysg.me/developers#errors).
                New codes may be added.
            message:
              type: string
              description: Human-readable. May change; do not parse.
            param:
              type:
              - string
              - 'null'
              description: The request field at fault, if any.
            request_id:
              type: string
              pattern: ^req_[0-9A-Za-z]{24}$
              description: Also sent as the SecurePay-Request-Id header. Quote it when asking for support;
                it is the correlation ID in the audit log.
    CreatePaymentRequest:
      type: object
      additionalProperties: false
      required:
      - amount
      - currency
      - order_reference
      - return_url
      properties:
        amount:
          type: integer
          minimum: 1
          description: In the currency's smallest unit. Its SGD value at today's rate must be S$0.50 to
            S$10,000 (else 400 `amount_too_small` / `amount_too_large`). Above the administrator's gateway-wide
            limit (in SGD) answers 422 `amount_above_limit`; above the merchant's own limit (if set) 422
            `amount_above_merchant_limit`.
        currency:
          enum:
          - SGD
          - USD
          - EUR
          - MYR
          - THB
          - IDR
          - PHP
          - JPY
          description: v2 (the same list as Payment `currency`). Any other value answers 400 `currency_not_supported`.
        order_reference:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[\x20-\x7E]+$
        return_url:
          type: string
          format: uri
          maxLength: 2048
          description: HTTPS address the customer's browser goes back to. Navigation only, never proof
            of payment.
        customer_email:
          type: string
          format: email
          maxLength: 254
          description: Optional. Prefills the checkout email; the customer can change it before paying.
            Receipts and the guest status check use the email confirmed at checkout.
        description:
          type: string
          maxLength: 200
          description: Optional. Shown on the checkout page and receipt.
        line_items:
          type: array
          minItems: 1
          maxItems: 50
          description: Optional. What the order contains, shown on the checkout page. The sum of quantity
            x unit_amount must equal `amount`, otherwise 400 `line_items_total_mismatch`. Fixed at creation
            like the amount.
          items:
            type: object
            additionalProperties: false
            required:
            - name
            - quantity
            - unit_amount
            properties:
              name:
                type: string
                minLength: 1
                maxLength: 100
              quantity:
                type: integer
                minimum: 1
                maximum: 999
              unit_amount:
                type: integer
                minimum: 0
                description: One unit
                in the payment currency's smallest unit.: null
    CapturePaymentRequest:
      type: object
      additionalProperties: false
      properties:
        amount:
          type: integer
          minimum: 1
          description: How much to capture, in the payment's currency, at most the payment's amount. Leave
            out to capture all of it. More than the amount answers 422 `capture_exceeds_authorised`.
    CreatePayoutRequest:
      type: object
      additionalProperties: false
      required:
      - amount
      properties:
        amount:
          type: integer
          minimum: 100
          description: Integer cents, at least S$1.00 (`PAYOUT_MIN_CENTS`) and at most the available balance
            (else 422 `insufficient_balance`).
    CreateRefundRequest:
      type: object
      additionalProperties: false
      required:
      - amount
      properties:
        amount:
          type: integer
          minimum: 1
          description: In the payment's currency, at most the payment's refundable_amount. Its SGD value
            comes from the payment's locked rate.
        reason:
          type: string
          maxLength: 200
  responses:
    InvalidRequest:
      description: 'Malformed body or a field out of range. Codes: invalid_json, missing_field, invalid_field,
        amount_too_small, amount_too_large, currency_not_supported, line_items_total_mismatch, return_url_not_https,
        card_data_not_allowed, idempotency_key_missing, idempotency_key_invalid.'
      headers:
        SecurePay-Signature:
          $ref: '#/components/headers/Signature'
        SecurePay-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: Missing, unknown or revoked API key (code api_key_invalid). Not signed, since the merchant
        is unknown.
      headers:
        SecurePay-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The merchant is not approved or is suspended (code merchant_not_active).
      headers:
        SecurePay-Signature:
          $ref: '#/components/headers/Signature'
        SecurePay-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: No such record for this merchant, including another merchant's record (code resource_not_found).
      headers:
        SecurePay-Signature:
          $ref: '#/components/headers/Signature'
        SecurePay-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: 'Codes: idempotency_key_reused, idempotency_request_in_progress (with Retry-After),
        payment_not_authorised, payment_already_captured, payment_already_cancelled, authorisation_expired,
        operation_in_progress, processor_rejected, operation_not_processed, payment_not_captured.'
      headers:
        SecurePay-Signature:
          $ref: '#/components/headers/Signature'
        SecurePay-Request-Id:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BusinessRule:
      description: 'Valid request refused by a business rule. Codes: amount_above_limit, amount_above_merchant_limit,
        capture_exceeds_authorised, refund_exceeds_refundable.'
      headers:
        SecurePay-Signature:
          $ref: '#/components/headers/Signature'
        SecurePay-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Over the rate limit for this key (100 a minute by default) or client IP address (300
        by default); administrators can change both. Code rate_limited.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        SecurePay-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: 'Unexpected failure (code internal_error). Not stored for idempotency: retry with the
        same key.'
      headers:
        SecurePay-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
externalDocs:
  description: Guides
  url: https://www.securepaysg.me/developers

openapi: 3.1.0
info:
  title: SecurePay merchant API
  version: 1.0.0
  summary: Payments, capture, cancel, refunds, status queries and webhooks for merchant servers.
  description: "The SecurePay merchant API: create a payment, send the customer to the hosted checkout,\n\
    then capture, cancel or refund it, and receive signed webhooks as its status changes.\n\n- **Base\
    \ URL**: `https://gateway.securepaysg.me` (a live demo: every payment is simulated, no real money\
    \ moves).\n- **Authentication**: `Authorization: Bearer sp_test_...` (test mode) or `sp_live_...`\
    \ (live\n  mode), from the merchant dashboard. Every object says which mode it belongs to in `livemode`.\n\
    - **Idempotency**: every `POST` needs an `Idempotency-Key` header, kept for 24 hours.\n- **Signatures**:\
    \ every reply to a valid key, and every webhook, carries\n  `SecurePay-Signature: t=<unix seconds>,v1=<hex\
    \ HMAC-SHA256 of \"t.\" + raw body>`, made with\n  your webhook signing secret (`whsec_...`).\n- **Money**:\
    \ integer cents in SGD (50 to 1,000,000).\n\nGuides (lifecycle, retries, errors, test cards): https://www.securepaysg.me/developers.\n\
    A TypeScript client is on npm as `securepaysg`.\n\nSecurePay is a student project (CSIT321 group FYP-26-S4-36,\
    \ University of Wollongong). It is not a licensed\npayment service and must never be used with real\
    \ card data.\n"
  contact:
    name: SecurePay developers
    url: https://www.securepaysg.me/developers
servers:
- url: https://gateway.securepaysg.me
  description: Live demo gateway (simulated payments)

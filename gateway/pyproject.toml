[project]
name = "fyp-gateway"
version = "0.1.0"
description = "Modular Django + DRF gateway (merchant API, hosted checkout, dashboards' API, vault, risk) plus the outbox worker."
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.2,<5.3",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=23.1",
    "gunicorn>=23.0",
    "httpx>=0.27",
    "djangorestframework>=3.15",
    "drf-spectacular>=0.27",
    "django-otp>=1.5",
    "segno>=1.6",  # QR code for first-time TOTP setup (D2), rendered as SVG
    "webauthn>=2.5,<3",  # v2 passkeys: WebAuthn registration and assertion checks (docs/v2/PASSKEYS.md)
    "cryptography>=43",
    "scikit-learn==1.7.*",
    "joblib>=1.4",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "hypothesis>=6",
    "jsonschema>=4.23",  # API replies are checked against contracts/schemas
    "ruff>=0.6",
    "mypy>=1.11",
    "django-stubs>=5.1",
    "pip-audit>=2.7",  # CI dependency audit (.github/ci-python.sh)
    "bandit>=1.7",  # CI code audit
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]  # generated by Django

[tool.ruff.lint.per-file-ignores]
# Django reads Meta options and ModelAdmin attributes as plain lists; ClassVar adds nothing.
"**/models.py" = ["RUF012"]
"**/admin.py" = ["RUF012"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apps*", "config*"]
